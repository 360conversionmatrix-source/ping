<!DOCTYPE html>
<html>
<head>
  <title>Ping Check Pest Agents (POST)</title>
</head>
<body>
  <h2>Ping Check Pest Agents</h2>
  <form action="https://offerglobe.trackdrive.com/api/v1/inbound_webhooks/ping/check_pest_agents" method="post">
    <!-- Caller ID (Traffic Source ID) -->
    <label for="traffic_source_id">Caller ID (Traffic Source ID):</label>
    <input type="text" id="traffic_source_id" name="traffic_source_id" placeholder="Enter Caller ID" required>
    <br><br>

    <!-- Phone Number -->
    <label for="trackdrive_number">Trackdrive Number:</label>
    <input type="text" id="trackdrive_number" name="trackdrive_number" placeholder="+18446044251" value="+18446044251" required>
    <br><br>

    <!-- ZIP Code -->
    <label for="zip">ZIP Code:</label>
    <input type="text" id="zip" name="zip" placeholder="Enter ZIP" required>
    <br><br>

    <button type="submit">Ping</button>
  </form>
</body>
</html>
